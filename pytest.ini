[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --tb=short
markers =
    integration: marks tests that hit a real database (deselect with -m 'not integration')
    eval: marks LLM-output evaluation tests (deselect with -m 'not eval')
